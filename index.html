<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17324d"><title>Opos-Radio · Tema 9</title><style>:root{--b:#f4f7fa;--c:#fff;--t:#183044;--a:#256b9e;--ok:#2e8b57;--bad:#c94c4c;--bd:#d9e2ea}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font-family:Arial,sans-serif;line-height:1.5}header{background:var(--t);color:#fff;text-align:center;padding:22px 15px}header h1{margin:0;font-size:1.6rem}main{max-width:720px;margin:auto;padding:18px 14px}.card{background:var(--c);border:1px solid var(--bd);border-radius:18px;padding:20px;box-shadow:0 3px 14px #18304412}.hidden{display:none}.mode{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mode button,.opt,.next,.restart{border:2px solid var(--bd);border-radius:13px;background:#fff;color:var(--t);padding:15px;font-size:1rem;cursor:pointer}.mode button:hover,.opt:hover{border-color:var(--a)}.mode button{text-align:left}.mode span{display:block;color:#607080;font-size:.88rem;margin-top:5px}.top{display:flex;justify-content:space-between;color:#607080}.bar{height:10px;background:#e5ebf0;border-radius:9px;margin:10px 0 18px;overflow:hidden}.bar i{display:block;height:100%;background:var(--a)}h2{font-size:1.2rem}.opt{display:block;width:100%;text-align:left;margin:10px 0}.correct{background:#e9f7ef!important;border-color:var(--ok)!important}.wrong{background:#fdeeee!important;border-color:var(--bad)!important}.feedback{margin-top:15px;padding:14px;background:#f2f6f9;border-left:5px solid var(--a);border-radius:10px}.next,.restart{width:100%;background:var(--a);color:#fff;border:0;margin-top:14px;font-weight:bold}.score{text-align:center;font-size:3rem;font-weight:bold;color:var(--a)}li{margin:9px 0}.small{color:#607080}@media(max-width:520px){.mode{grid-template-columns:1fr}}</style></head><body><header><h1>🩻 OPOS-RADIO</h1><div>Tema 9 · Procesado de imagen</div></header><main><section id="start" class="card"><h2>Fundamentos del procesado y aplicaciones básicas y avanzadas</h2><p>20 preguntas basadas en tus apuntes.</p><div class="mode"><button onclick="start('study')"><b>📚 Modo estudio</b><span>Corrección y explicación después de cada respuesta.</span></button><button onclick="start('exam')"><b>⏱️ Modo examen</b><span>Resultado al terminar.</span></button></div></section><section id="quiz" class="card hidden"><div class="top"><span id="n"></span><span id="m"></span></div><div class="bar"><i id="p"></i></div><h2 id="q"></h2><div id="o"></div><div id="f" class="feedback hidden"></div><button id="next" class="next hidden" onclick="next()"></button></section><section id="res" class="card hidden"><h2>🏆 Resultado</h2><div id="score" class="score"></div><p id="msg" style="text-align:center"></p><div id="review"></div><button class="restart" onclick="location.reload()">🔄 Volver a hacer el test</button></section></main><script>
const Q=[
['¿Cuál es una ventaja principal de la radiografía digital?',['Mayor dosis','Menor rango dinámico','Mayor capacidad de procesado y rango dinámico','Imposibilidad de duplicar imágenes'],2,'La radiografía digital permite optimizar la imagen, ofrece mayor rango dinámico y facilita su archivo y procesado.'],
['El rango dinámico permite:',['Detectar diferentes densidades','Eliminar todo el ruido','Reducir el tamaño del píxel','Impedir el procesado'],0,'Permite representar un amplio rango de densidades del organismo.'],
['La DQE se relaciona principalmente con:',['La eficiencia del detector respecto al ruido','El tamaño del paciente','La dosis exclusivamente','El número de proyecciones'],0,'La DQE es un indicador de la eficiencia con la que el detector aprovecha la señal frente al ruido.'],
['Según tus apuntes, al disminuir el tamaño del píxel:',['Siempre desaparece el ruido','Puede aumentar el ruido y disminuir la DQE','No cambia nada','Siempre aumenta la DQE'],1,'Tus apuntes destacan el compromiso entre resolución espacial, tamaño de píxel y ruido.'],
['En ventana/nivel, el NIVEL determina principalmente:',['El tipo de tejido o rango de densidades visualizado','La anchura del detector','La dosis','El tamaño de la imagen'],0,'Nivel = qué rango de densidades estamos mirando.'],
['Una ventana ESTRECHA ofrece:',['Muchos grises y poco contraste','Pocos grises y mayor contraste','Menos contraste','Menos información siempre'],1,'Ventana estrecha = menos grises y mayor contraste.'],
['Una ventana ANCHA ofrece:',['Muchos grises y poco contraste','Pocos grises y mucho contraste','Solo hueso','Solo aire'],0,'Ventana ancha = muchos grises y poco contraste.'],
['El realce de bordes:',['Disminuye siempre el ruido','Mejora contornos pero aumenta el ruido','Elimina las interfaces','Reduce la visibilidad'],1,'Todo realce de bordes implica aumento de ruido.'],
['La ecualización tisular permite:',['El mismo procesado para todo','Procesados distintos según la zona o tejido','Eliminar la dosis','Eliminar el detector'],1,'El equipo adapta el procesado a distintas zonas de la imagen.'],
['La corrección de una sobreexposición puede:',['Aumentar el ruido','Eliminar toda la información','Convertirla en analógica','Eliminar el rango dinámico'],0,'La corrección puede compensar la sobreexposición, pero con más ruido.'],
['Los fotones de alta energía se relacionan en tus apuntes con:',['Fotoeléctrico y mucha diferencia de atenuación','Compton y poca diferencia de atenuación','Doppler','Piezoelectricidad'],1,'Alta energía → Compton → poca diferencia de atenuación.'],
['Los fotones de baja energía se relacionan con:',['Compton','Fotoeléctrico','Doppler','Resonancia'],1,'Baja energía → fotoeléctrico → mayor diferencia de atenuación.'],
['En energía dual de doble disparo se obtienen finalmente:',['1 imagen','2 imágenes','3 imágenes','5 imágenes'],2,'Se obtienen imagen convencional, imagen para hueso e imagen para partes blandas.'],
['En el esquema de doble disparo de tus apuntes, el primer disparo es de:',['60 keV','120 keV','28 keV','45 keV'],1,'El primer disparo indicado es de 120 keV.'],
['En mamografía con energía dual se utiliza contraste:',['Bario','Yodo','Gadolinio','Aire'],1,'La técnica descrita utiliza contraste yodado.'],
['En mamografía con energía dual, el primer disparo de baja energía muestra principalmente:',['Parénquima mamario','Solo yodo','Hueso','Músculo'],0,'El disparo de 28/33 kV muestra el parénquima mamario.'],
['La tomosíntesis se basa en:',['Un solo disparo','Múltiples disparos desde distintos ángulos','Solo contraste','Una imagen estática'],1,'La adquisición se realiza con múltiples proyecciones anguladas.'],
['La tomosíntesis ayuda especialmente a:',['Eliminar la superposición de estructuras','Aumentar la superposición','Eliminar el detector','Evitar todo ruido'],0,'Permite separar estructuras superpuestas y mejorar su visualización.'],
['¿Qué rango angular aparece en tus apuntes como ejemplo de tomosíntesis?',['-15° a +15°','-90° a +90°','0° a 5°','-45° a +45°'],0,'Tus apuntes indican aproximadamente de -15° a +15°.'],
['En el estudio mamario 3D descrito en tus apuntes se realizan:',['Solo CC','Tomosíntesis CC + ML','Solo MLO','Solo una lateral'],1,'El esquema indica 3D = tomosíntesis en CC + ML.']];
let mode='',i=0,hits=0,ans=[];function start(x){mode=x;i=0;hits=0;ans=[];startEl.classList.add('hidden');res.classList.add('hidden');quiz.classList.remove('hidden');m.textContent=x==='study'?'📚 Estudio':'⏱️ Examen';show()}function show(){let x=Q[i];n.textContent=`Pregunta ${i+1} de 20`;p.style.width=((i)/20*100)+'%';q.textContent=x[0];o.innerHTML='';f.classList.add('hidden');nextBtn.classList.add('hidden');x[1].forEach((t,j)=>{let b=document.createElement('button');b.className='opt';b.innerHTML=`<b>${'ABCD'[j]})</b> ${t}`;b.onclick=()=>answer(j,b);o.appendChild(b)});nextBtn.textContent=i===19?'Ver resultado 🏆':'Siguiente pregunta →'}const nextBtn=document.getElementById('next'),startEl=document.getElementById('start'),quiz=document.getElementById('quiz'),res=document.getElementById('res');function answer(j,b){let x=Q[i],bs=[...document.querySelectorAll('.opt')];bs.forEach(z=>z.disabled=true);ans[i]=j;if(j===x[2]){hits++;b.classList.add('correct')}else{b.classList.add('wrong');bs[x[2]].classList.add('correct')}if(mode==='study'){f.classList.remove('hidden');f.innerHTML=`<b>${j===x[2]?'✅ ¡Correcta!':'❌ Incorrecta'}</b><br>${x[3]}`}p.style.width=((i+1)/20*100)+'%';nextBtn.classList.remove('hidden')}function next(){if(i<19){i++;show()}else result()}function result(){quiz.classList.add('hidden');res.classList.remove('hidden');let pct=Math.round(hits/20*100),note=(hits/2).toFixed(1);score.textContent=note+'/10';msg.innerHTML=`<b>${hits>=18?'🔥 ¡Nivelazo!':hits>=14?'💪 ¡Muy bien!':hits>=10?'📚 Aprobado, pero toca repasar':'🧠 Vamos a reforzar este tema'}</b><br>${hits}/20 aciertos · ${pct}%`;let w=Q.map((x,k)=>[x,k]).filter(z=>ans[z[1]]!==z[0][2]);review.innerHTML=w.length?'<h3>📌 Para repasar</h3><ol>'+w.map(z=>`<li><b>${z[0][0]}</b><br><span class="small">Correcta: ${z[0][1][z[0][2]]}</span></li>`).join('')+'</ol>':'<h3>🏆 ¡Perfecto!</h3><p>Has acertado las 20 preguntas.</p>'}
</script></body></html>
