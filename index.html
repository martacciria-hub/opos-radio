const topics={
39:`TEMA 39. EXPLORACIÓN ECOGRÁFICA APARATO GENITAL MASCULINO.\n\nTESTÍCULO\n· INTRODUCCIÓN, ANATOMÍA Y FUNCIONES\nLa eco es la técnica para el estudio de la patología escrotal, aporta gran resolución espacial con alta sensibilidad para identificar lesiones tanto dentro como fuera del testículo.\n\n⟶ ESCROTO: Saco formado por un conjunto de envolutas dividido en dos por un rafe tendinoso. Cada saco (“hemiescroto”) contiene un testículo con el epidídimo y el cordón espermático. Las capas que forman la pared del escroto desde la superficie hasta los planos profundos son 7:\n→ Piel\n→ Músculo “dartos”\n→ Capa celular subcutánea\n→ Fascia espermática externa\n→ Músculo cremáster\n→ Fascia espermática interna\n→ Túnica Vaginal: Membrana serosa con dos capas (visceral y parietal) que derivan del proceso vaginal del peritoneo, y entre ellas forman un espacio virtual. Recubre el testículo y el epidídimo por fuera de la albugínea salvo en la parte posterior, en la unión del testículo y el epidídimo.\n\nCONTENIDO DEL ESCROTO\n⟶ Testículo: Glándulas ovaladas y simétricas alojadas en la bolsa llamada escroto, son las gónadas masculinas y su función es la producción de espermatozoides y hormonas sexuales masculinas. La túnica albugínea es la capa fibrosa que envuelve el testículo. La albugínea emite numerosos septos desde su cara interna, que convergen en la parte posterior del testículo, donde se pliega hacia el interior de éste formando un septo incompleto llamado mediastino testicular. Esta tabicación da lugar a numerosos lobulillos (200-400) con forma de cuña que contienen los túbulos seminíferos donde se forma el esperma. Los túbulos confluyen en el mediastino testicular formando el “rete testis”.\n\n⟶ Epidídimo: Estructura curvada que mide 6/7 cm, con situación posterolateral al testículo. Las partes son Cabeza, Cuerpo y Cola. Su función es transportar el semen producido en los conductos espermáticos hasta el conducto deferente.\n\n⟶ Apéndices testiculares: Son restos embrionarios; los más frecuentes son el apéndice testicular de morfología ovoidea y se localiza en la línea que separa el testículo y la cabeza del epidídimo. Y el epididimario, suele ser similar al testicular pero pediculado y está localizado en la cabeza del epidídimo.\n\n⟶ Cordón espermático: Constituido por el conducto deferente, las arterias cremastérica, deferencial y testicular, el plexo venoso pampiniforme, el nervio genitofemoral, los vasos linfáticos y los nervios de los testículos. Tiene su origen en el anillo inguinal profundo y desciende verticalmente hacia el escroto.\n\n⟶ Vascularización: El escroto y su contenido están irrigados por 3 arterias: Cremastérica, testicular (rama de la aorta) y deferencial. El drenaje venoso se realiza a través del plexo pampiniforme, que está formado por la unión de pequeñas venas testiculares y asciende por el cordón espermático como una red que lo envuelve.\n\nTÉCNICA DE EXPLORACIÓN\nLo primero es la revisión de los estudios previos para hacer una comparativa.\n\n→ Preparación del paciente y posicionamiento: Decúbito supino, elevando el escroto y con el pene sobre el abdomen para separarlo de los testículos.\n→ Equipo: El estudio de hace con sonda lineal de alta frecuencia, ya que son órganos superficiales. Se recomiendan sondas entre 7-14 MHz, en casos de escroto aumentado, se pueden usar sondas convexas de baja frecuencia o funciones como imagen panorámica. En cuanto al gel es recomendable usar bastante. El Doppler color, es conveniente usar altas frec. ya que aportan más resolución y más sensibilidad para la detección de flujos lentos o escasos.\n\nTÉCNICA: Los testículos deben ser evaluados en dos planos, longitudinal y transversal. Las imágenes en plano transversal deben obtenerse en la parte superior media e inferior del teste. Las longitudinales, deben obtenerse en central, medial y lateral.\n\nCada teste debe ser barrido en su totalidad, para identificar el epidídimo y sus partes. Ha de obtenerse un plano transversal que muestre ambos testículos al mismo tiempo para poder comparar o con la adquisición de imágenes en doble ventana, valorando la ecogenicidad, tamaño y estructura de cada testículo. El epidídimo se valora con el ecógrafo posicionado sobre el eje longitudinal y posterior del testículo.\n\n→ Ecogenicidad y medidas: Debe evaluarse el espesor de las cubiertas escrotales de forma comparativa, el grosor normal es la pared del escroto es de 2-8mm, dependiendo de la contracción del músculo cremáster. Los testículos y epidídimos son discretamente hiperecogénicos en la edad adulta y ser ligeramente hipoecogénicos en la infancia.\n\nEl tamaño normal en adulto es de 3-5 cm de longitud, 2-4 cm de ancho y 3cm de diámetro anteroposterior. Los epidídimos son isoecogénicos o ligeramente hipoecogénicos respecto a los testículos. La cabeza del epidídimo tiene forma de pirámide de unos 5-12 mm de longitud máxima en el polo superior del testículo, el cuerpo del epidídimo es muy estrecho 2-4mm, la cola se localiza cerca del polo inferior del testículo, donde se convierte en la parte proximal del conducto deferente.\n\nEl “mediastinum testis” se identifica como una banda hiperecogénica de grosor y longitud variable que se extiende en dirección craneocaudal.\n\nLa “rete testis” se puede identificar hasta en un 18% de los pacientes como un área hipoecogénica estratificada adyacente al mediastinum testis.\n\nLa túnica albugínea se muestra como una delgada línea ecogénica que rodea el testículo, las dos capas de túnica vaginal delimitan un espacio virtual. Puede existir, en condiciones normales una pequeña cantidad de líquido entre las dos capas, que se identifica como una lengüeta anecogénica cerca de la cabeza del epidídimo que no debe confundirse con un hidrocele. Los apéndices testiculares suelen ser isoecogénicos con el parénquima testicular, y con menos frecuencia, quísticos.\n\nEs más fácil identificarlos cuando existe líquido entre las dos capas de la túnica vaginal, ya que normalmente están aplastados contra el testículo y se confunden con el parénquima.\n\n⟶ Vascularización: Se analizará mediante Doppler color, espectral y potencia, se debe realizar en todas las exploraciones, especialmente en los casos de escroto agudo. Es imprescindible realizar un estudio comparativo obteniendo imágenes con doble ventana en las que los parámetros del Doppler, sean idénticos al analizar y obtener imágenes de cada uno de los dos testículos y sus epidídimos. Debe empezarse el estudio por el testículo sano, para ajustar los parámetros de la escala de grises y Doppler y mantenerlos a lo largo del estudio, si no es posible obtener flujo de Doppler, se puede optimizar la imagen subiendo ganancia y bajando frecuencia de repetición para aumentar la sensibilidad, o usar Doppler potencia, pero manteniendo los mismos parámetros en ambos testículos.\n\n⟶ Estructuras extratesticulares: Debe realizarse una evaluación ecográfica de las estructuras extratesticulares. Se pueden emplear maniobras de valsalva para su evaluación, El cordón espermático es muy superficial y difícil de distinguir de los tejidos blandos que lo rodean, se localiza superior a la cabeza del epidídimo en plano sagital, se puede visualizar dentro del escroto cuando hay hidrocele o mediante Doppler color.\n\nPATOLOGÍA DEL ESCROTO\n⟶ ANOMALÍAS CONGÉNITAS\n1. Testículos no descendidos (criptorquidia): descenso incompleto en su trayecto desde el abd al escroto, la bolsa escrotal está vacía. Se pueden localizar en cualquier nivel de la línea de descenso, se pueden identificar en el canal inguinal.\n2. Agenesia testicular(anorquia): Puede faltar un testículo o los dos.\n3. Atrofia testicular: Disminución del tamaño testicular con respecto a la normalidad.\n\n⟶ TUMORES TESTICULARES\n1. Quiste: lesión anecogénica redondeada con refuerzo acústico posterior\n2. Quiste de la túnica: Se reconoce porque puede deformar el contorno testicular\n3. Ectasia de la rete testis: Dilatación benigna por obstrucción parcial o completa del conducto deferente. Suele ser bilateral y más frecuente en personas mayores de 55a. Se identifica como múltiples estructuras anecogénicas quísticas de pequeño tamaño en torno al mediastino testicular.\n4. Tumor epidermoide: Lesión redondeada con patrón en “capas de cebolla” vistas como anillos concéntricos hiperecogénicos e hipo. alternantes.\n5. Microcalcificaciones (microlitiasis) testiculares: Focos milimétricos hipereco, sin sombra acústica posterior distribuidos por el parénquima testicular, la presencia de 5 o más se considera anormal. Se ha relacionado con el desarrollo de tumores germinales testiculares y aunque no hay evidencia de que se trate de una lesión premaligna, se recomienda seguimiento.\n6. Macrocalcificaciones: Pueden ser debidas a procesos cicatriciales.\n⟶ TUMORES MALIGNOS\nSuelen presentarse como una masa hipoecogénica de bordes mal definidos y vascularización interna, aunque bastante homogéneos en el caso de los seminomas. Pueden ser multifocales en el caso de los tumores no seminomatosos, pueden tener áreas quísticas o focos ecogénicos debidos a calcificación fibrosis o hemorragia.\nSe clasifican en: → Tumores de células germinales → Tumores no germinales\n\n⟶ ESCROTO AGUDO\nCuadro clínico caracterizado por la aparición de dolor agudo acompañado de tumefacción y signos inflamatorios en el escroto, se considera una urgencia médica. Las posibles causas son:\n1. Inflamación/infección: Epididimitis y orquiepididimitis: es la causa más frecuente de dolor testicular en adolescentes y adultos y se caracteriza por una inflamación del epidídimo debido a infección. Características ecográficas: Aumento de flujo en Doppler, suele ser unilateral. El epidídimo suele estar aumentado de tamaño y puede ser hipoecogénico o hiperecogénico, puede existir hidrocele reactivo y engrosamiento de las cubiertas escrotales. Habitualmente empieza afectando a la cola del epidídimo y se extiende al cuerpo y a la cabeza. Si la infección progresa, también al testículo ⟶ Orquiepididimitis, el testículo puede presentar una ecogenicidad heterogénea y hay un aumento del flujo en Doppler en el testículo afectado, al compararlo con el contralateral.\n2. Torsión testicular: Rotación del testículo sobre sí mismo de forma que el cordón espermático con los vasos testiculares se retuercen y se produce un compromiso vascular, es una emergencia quirúrgica por el riesgo de isquemia. Características ecográficas: Cuando se detectan alteraciones en la ecogenicidad, es en los casos de torsión avanzada, en los que puede haber una ecogenicidad heterogénea con áreas hipoecogénicas debido a congestión edema e infarto. Es imprescindible utilizar el modo Doppler para el diagnóstico, la frecuencia del pulso y el filtro de pared deben estar en niveles bajos. Inicialmente, existe una ausencia de flujo venoso y posteriormente también arterial en el testículo afectado al compararlo con el contralateral. Ha de confirmarse la presencia de flujo en las venas y las arterias intratesticulares con Doppler pulsado, respecto al cordón espermático, se puede visualizar el giro o tirabuzón del cordón, conocido como whirlpool sign. Es muy específico de torsión y se manifiesta como una masa con forma de espiral de localización posterosuperior al testículo con ausencia de flujo o escaso en los casos de torsión intermitente. En los casos de resolución espontánea, se puede ver un flujo intratesticular muy aumentado debido a la llamada fase de reperfusión.\n3. Torsión del apéndice testicular: características ecográficas: apéndice aumentado de tamaño, con aumento de flujo periférico en la exploración con Doppler, es frecuente que exista cierta cantidad de hidrocele reactivo, después del episodio agudo, el apéndice disminuye de tamaño y se calcifica, el papel de la eco es descartar torsión testicular y orquiepididimitis.\n4. Traumatismo: a consecuencia de un traumatismo directo, lo más importante es determinar si existe rotura testicular, ya que es una urgencia quirúrgica, hallazgos del traumatismo:\n⟶ Hidrocele: colección de líquido anecogénico o con focos milimétricos ecogénicos en su interior entre las dos capas de la túnica vaginal.\n⟶ Hematocele: colecciones quísticas complejas con septos internos y tabiques que forman compartimentos, su aspecto es muy parecido al del piocele (hidrocele sobreinfectado).\n⟶ Hematoma: el agudo es hiperecogénico y puede simular una masa testicular, al cabo de dos semanas se vuelve quístico.\n⟶ Rotura testicular: se manifiesta como discontinuidad de la túnica albugínea, también puede existir irregularidad del contorno testicular y ecogenicidad heterogénea con pérdida de la vascularización del parénquima.\n⟶ Fractura: Discontinuidad del parénquima testicular, a veces se puede identificar una línea hipoecogénica que corresponde a un área avascular en el parénquima, hallazgo que se puede asociar o no a la ruptura de la túnica albugínea.\n\nLESIONES EXTRATESTICULARES\nEPIDÍDIMO\n⟶ Quistes: son frecuentes y se suelen localizar en la cabeza\n⟶ Espermatocele: quistes de retención de esperma, similares a los quistes de epidídimo o con un contenido más ecogénico, se localizan en la cabeza y pueden aparecer después de la vasectomía.\n⟶ Tumor adenomatoide: es benigno y el más frecuente en el epidídimo se localiza en la cola, y su apariencia es la de una imagen nodular hiperecogénica, homogénea y con bordes bien definidos. Otros tumores malignos son muy raros.\n\nCORDÓN ESPERMÁTICO\n⟶ Varicocele: dilatación anormal de las venas del plexo pampiniforme, más frecuentes en el lado izq. Características ecográficas: estructuras anecogénicas serpiginosas en el borde posterosuperior del testículo, el uso del Doppler durante la maniobra de valsalva es clave para el diagnóstico, ya que se observa un llamativo aumento del diámetro y del flujo de las venas afectadas, en ocasiones, es necesario explorar al paciente en Bipedestación para potenciar la visualización del aumento del flujo venoso.\n\nMISCELÁNEA\n⟶ Escrotolitos (perlas escrotales): son calcificaciones libres dentro de la túnica vaginal, resultado de torsión de apéndices o depósitos cálcicos inflamatorios, pueden medir desde unos mm hasta 1cm.\n⟶ Hernia inguinoescrotal: es la masa extratesticular más frecuente en el saco escrotal, normalmente contiene asas intestinales o grasa, las hernias intestinales están llenas de líquido y gas, muestran peristaltismo y aumentan de tamaño con la maniobra valsalva, se pueden localizar en el conducto inguinal o en el escroto.\n\nPRÓSTATA\n· ANATOMÍA Y FUNCIONES\nLa próstata es una glándula exocrina con forma de cono invertido esférico, donde el margen superior es la base y el margen inferior el ápex. Se localiza en el espacio pélvico por debajo de la vejiga y rodeando la uretra, por delante del recto y por detrás de la sínfisis púbica y por encima del diafragma urogenital.\nSu función como glándula sexual accesoria es producir una serie de secreciones que, vertidas en la uretra y mezcladas con los espermatozoides, constituyen el semen que sale al exterior durante la eyaculación. Tiene el tamaño de una castaña con un diámetro aprox de 4cm (transverso), 3cm (ap) y 3 cm (craneocaudal). El peso en jóvenes es de unos 20 gr y aumenta con la edad, la nomenclatura actual utiliza el modelo anatómico de McNeal que se basa en la anatomía zonal. Se distinguen dos zonas en lugar de lóbulos como en la nomenclatura “antigua”.\n⟶ Glándula central, formada por: 1. Zona central fibromuscular anterior 2. Zona transicional\n⟶ Glándula periférica\nLas vesículas seminales son glándulas que producen aprox el 60% del líquido seminal. Son pares, se localizan superolateralmente a la próstata y están englobadas por la grasa hiperecogénica que las rodea, el tamaño y forma de las vesículas seminales varía con la cantidad de contenido que tengan, se pueden reconocer en la pared posterior de la vejiga y miden 3cm de longitud x 1,5 de diámetro.\n\n· TÉCNICA DE EXPLORACIÓN ECOGRÁFICA\nECOGRAFÍA SUPRAPÚBICA: Se usa para medir el tamaño de la próstata y el residuo posmiccional. No tiene suficiente resolución para delimitar la anatomía zonal ni para la detección de tumores.\nECOGRAFÍA TRANSRECTAL: Se introduce el transductor de alta frecuencia con forma cilíndrica por el recto, es capaz de delimitar la anatomía, se usa para protocolos de detección de cáncer y procedimientos intervencionistas como guía para biopsias.\n\n·PREPARACIÓN DEL PACIENTE\nEcografía suprapúbica: Necesitamos una repleción vesical de unos 150mL, paciente en decúbito supino con abdomen y zona suprapélvica descubiertas, la exploración se realiza con la sonda convexa o lineal de baja frecuencia, barriendo sobre los ejes transversal y longitudinal, para medir sus diámetros. El volumen prostático se calcula a través del cálculo del producto de los ejes y multiplicando el resultado restante por 0,523 expresando el resultado final en mililitros (ahora lo hace el ecógrafo).\nEcografía transrectal: Paciente en decúbito lateral izq. se prepara al paciente con un enema de limpieza, cubrimos la sonda con un condón y usamos bastante gel lubricante. Se introduce la sonda en el recto y se empieza el estudio, las imágenes que se obtienen serán en plano transversal o semicoronal y sagital.\n\n· PATOLOGÍA DE PRÓSTATA Y VESÍCULAS SEMINALES\nLa hipertrofia benigna es la afección más frecuente que suele aparecer a partir de los 50, se caracteriza por sintomatología obstructiva e irritativa de la próstata y del tracto urinario inferior. Los hallazgos ecográficos son:\n→ Aumento de diámetros ap y longitudinal, que producen una impronta sobre la base vesical, permaneciendo estable en el transverso. Se considera patológico cuando el volumen es superior a 27mL, o cuando el diámetro ap supera los 3cm.\n→ Compresión progresiva de la uretra y dificultad al orinar por aumento de tamaño prostático. Esto impide el flujo de la orina desde la vejiga y a través de la uretra, lo que conlleva el llamado “residuo posmiccional”. Otros hallazgos son nódulos hipoecogénicos o heterogéneos, calcificaciones prostáticas y áreas quísticas.\n→ Quistes congénitos (mülleriano y de utrículo), quistes de retención y quistes degenerativos\n→ Quistes congénitos en las vesículas seminales, como hallazgo incidental o asociados a otras anomalías genitourinarias.\n→ Prostatitis, proceso inflamatorio agudo o crónico, con diversas etiologías, es una afección que se diagnostica basándose en el cuadro clínico y la exploración del paciente, los signos que se pueden hallar por eco son:\n1. Aumento del tamaño prostático\n2. Dolor a la compresión del transductor\n3. Áreas hipoecogénicas, hiperecogénicas o heterogéneas especialmente visibles en las zonas periféricas\n4. Calcificaciones\n5. Abscesos prostáticos ***Sólo en algunos casos***\n\nPENE\n·ANATOMÍA Y FUNCIONES\nÓrgano masculino que participa tanto en el sistema reproductor como en el urinario. El interior del pene está constituido por dos cuerpos cavernosos localizados en el dorso del pene y un cuerpo esponjoso de localización ventral que rodea a la uretra. Los tres cuerpos están formados por tejido eréctil, con múltiples sinusoides venosos que se rellenan de sangre durante la erección y rodeados por una túnica albugínea, la fascia de Buck (profunda) y la fascia dartos (superficial).\n\n·TÉCNICA DE EXPLORACIÓN ECOGRÁFICA E INDICACIONES\nLa exploración se hace con el paciente en decúbito supino, con el pene en flexión dorsal sobre el abdomen. El pene se tiene que estudiar en el plano longitudinal y transversal, con una sonda lineal de alta frecuencia. Es importante no ejercer mucha presión con el transductor para no comprimir los vasos, ecográficamente, los cuerpos cavernosos y el cuerpo esponjoso, son estructuras cilíndricas y homogéneas.\nEl cuerpo esponjoso, es ligeramente más hipoecogénico que los cuerpos cavernosos.\nLa túnica albugínea y la fascia Buck estás pegadas y se identifican como una sola línea hiperecogénica que rodea a los cuerpos cavernosos y al esponjoso.\nLas arterias cavernosas, fáciles de identificar con Doppler color, son dos puntos hipoecogénicos localizados en el interior de los cuerpos cavernosos.\nLos vasos dorsales (arterias y vena profunda y superficial del pene) se localizan en el dorso del pene por fuera de la túnica albugínea, es posible realizar un análisis morfológico y funcional mediante el Doppler y la inyección de fármacos vasodilatadores intracavernosos.\n\n·INDICACIONES\n→ Estudio de disfunción eréctil (causa arterial y venosa)\n→ Induración dolorosa (enfermedad de Peyronie y lesiones focales)\n→ Traumatismo (hematoma, rotura y complicaciones)\nEco suprapúbica, con los planos de estudio básicos.\nHipertrofia benigna de próstata, aumento del tamaño de todos los diámetros, heterogénea y con impronta sobre la pared posterior de la vejiga.\nDiámetros: D1, longitudinal / D2, transversal / D3, anteroposterior.`,
40:`TEMA 40. EXPLORACIÓN ECOGRÁFICA DEL APARATO GENITAL FEMENINO\n\nINTRODUCCIÓN\nEs la modalidad preferida para el estudio de la pelvis femenina, ampliamente disponible, no es invasiva, no utiliza radiación, la curva de aprendizaje es relativamente fácil y proporciona información diagnóstica útil.\n\nANATOMÍA Y FISIOLOGIA\nVaría según la edad y la fase del ciclo menstrual, los genitales internos constan de:\n⟶ OVARIOS: Gónadas femeninas. Durante la etapa fértil tienen forma elíptica con un tamaño de 3*2*2cm, suelen localizarse a los lados del cuello uterino, en la pelvis menor aunque al ser móviles pueden ubicarse en el fondo del saco de Douglas, a los lados de los cuernos uterinos o incluso intraabdominales.\nLa mejor referencia para localizarlos es el borde interno de los vasos ilíacos. La mujer tiene 400.000 folículos primordiales aunque en la etapa fértil se sueles desarrollar unos 400 aprox. En la corteza ovárica se hallan folículos en diferentes grados de desarrollo, entre ellos el ovocito. El folículo se desarrolla junto con el ovocito, siguiendo la secuencia:\n⟶ folículo primordial ⟶ folículo primario ⟶ folículo secundario ⟶ folículo maduro o de De Graaf.\nEste proceso está regulado por el eje hipotálamo-hipofisario donde se produce la hormona luteinizante y la hormona foliculoestimulante, y por las hormonas ováricas, estrógenos y progesterona.\n\n⟶ TROMPAS DE FALOPIO: Conductos que se originan en ambos cuernos uterinos, se dirigen a ambos lados de la pelvis y terminan cerca del ovario. Miden entre 10 y 12 cm y se dividen en varios segmentos.\n→ Intersticial: pasa por el músculo del útero.\n→ Ístmico: es el segmento estrecho muscular a la salida del útero\n→ Ampular: parte central más larga\n→ Infundibular: segmento distal próximo al ovario que se ensancha en forma de embudo.\n→ Zona fímbrica: es el final del embudo, que rodea parte del ovario con una prolongaciones ciliares, recogen el óvulo liberado del ovario moviéndose por la fímbrias hacia el interior de la trompa donde se produce la fertilización y después el óvulo fertilizado va hacia la cavidad endometrial, lugar de implantación.\n\n⟶ ÚTERO: Entre la vejiga y el recto, tiene forma de pera invertida y mide entre 6 y 9 cm y 5 de ancho, aunque varía mucho con la edad. Se divide en 4 partes\n→ Fundus uterino: parte superior abombada\n→ Cuerpo uterino: porción central que contiene la cavidad endometrial\n→ Istmo: que se encuentra entre el cuerpo y el cuello, aunque fuera de la gestación no tiene gran importancia\n→ Cuello o Cérvix: Porción distal más estrecha que se une a la vagina formado a su vez por el orificio cervical externo, también llamado hocico de TENCA, el canal cervical y el orificio cervical interno.\n\nEl útero está compuesto por tres capas\n1. Perimetrio (capa más externa); lateralmente forma dos amplios pliegues que constituyen los ligamentos anchos uterinos\n2. Miometrio (capa intermedia y gruesa) formada por tres capas de fibras musculares lisas que se extienden en todas direcciones, es hormonosensible y se hipertrofia durante el embarazo\n3. Endometrio (capa interna) recubre la cavidad uterina, muy vascularizada y se compone de tres estratos:\n→ Estrato compacto (capa superficial) formada por epitelio cilíndrico de células ciliadas y secretoras\n→ Estrato esponjoso; formado por glándulas endometriales que segregan moco\n→ Estrato Basal; formado por tejido conjuntivo que une con el miometrio.\nDurante la menstruación, la capa funcional formada por los estratos compacto y esponjoso, descama y pierde espesor. La función del útero es proporcionar el ambiente adecuado para que se produzca el embarazo, permite que el esperma del varón ascienda hacia las trompas, si existe fecundación; posibilita la implantación en el endometrio, las glándulas endometriales producen secreciones nutritivas para mantener el desarrollo del embarazo hasta que se forme la placenta y durante el parto, las contracciones de la musculatura uterina hacen que el feto salga al exterior.\n\nINDICACIONES PARA LA EXPLORACIÓN\nSegún las guías de práctica clínica del American Institute of Ultrasound in Medicine incluyen:\n1. Dolor pélvico\n2. Dismenorrea (dolor menstrual)\n3. Amenorrea (ausencia de regla)\n4. Menorragia (Exceso de sangrado menstrual)\n5. Metrorragia (sangrado uterino irregular)\n6. Menometrorragia (Sangrado uterino irregular y abundante)\n7. Seguimiento de una alteración\n8. Valoración, seguimiento o tratamiento de las pacientes infértiles\n9. Retraso menstrual, pubertad precoz o sangrado vaginal en pacientes prepuberales.\n10. Sangrado posmenopáusico\n11. Exploración pélvica anormal\n12. Signos y síntomas de infección pélvica\n13. Avanzar en la cateterización de una alteración pélvica vista por otra técnica de imagen.\n14. Evaluación de anomalías congénitas\n15. Sangrado excesivo, dolor o signos de infección después de cirugía pélvica, parto o aborto.\n16. Localización de dispositivos intrauterinos\n17. Detección precoz de cáncer en pacientes de riesgo\n18. Incontinencias o prolapsos\n19. Como guía de procedimientos intervencionistas\n\nAntes de empezar el estudio, es importante realizar una buena anamnesis, ya que tiene gran poder orientativo y es indispensable para interpretar la imagen ecográfica y se abordará progresivamente durante la exploración.\n1. Motivo\n2. Paridad, gestaciones\n3. Fase de la vida genital\n4. Fase del ciclo\n5. Antecedentes quirúrgicos\n6. Anticoncepción\n7. Características del ciclo\n8. Hemorragias\n9. Dolor pélvico\n10. Dolor extrapélvico\n11. Estado general\n\nTÉCNICAS DE EXAMEN\nSe pueden usar varias vías de abordaje; las principales son la transabdominal o suprapúbica y la transperineal, deben usarse combinadas. Como vías alternativas están la transrectal y la transperineal. Técnicas más complejas Histerosonográfica y la histerosonosalpingografía.\n\n⟶ Equipamiento: Se usan ecógrafos con una buena resolución, en tiempo real, con modo B, escala de grises y si es posible Doppler color y pulsado. Las sondas deben ser adecuadas, convexas multifrecuencia para la transabdominal y endocavitarias multifrecuencias para el estudio transvaginal.\n\nEcografía TRANSABDOMINAL\n⟶ Preparación: Buena repleción vesical (no hacer pis 4/5h antes o medio litro de agua 30' antes de la prueba. En algunas ocasiones se puede administrar un diurético o llenar la vejiga mediante sondaje vesical.\n⟶ Técnica de examen: Sondas convexas multifrecuencia para una visión global de todos los órganos pélvicos. La vagina y el útero son los marcadores anatómicos como referencia para localizar el resto de la estructuras pélvicas, es el eje uterovaginal.\n⟶ Colocación de la paciente: Decúbito supino, se empieza el estudio con el plano sagital (longitudinal) sobre el eje uterovaginal, consiguiendo un corte long. medial. Después, se localizan los anejos mediante barrido transversal ascendente efectuado a cada lado del útero, colocando la sonda en el lado opuesto de la estructura estudiada y, luego, cortes en los planos axiales (transversales). Deben valorarse: 1. Útero 2. Anejos (tanto ovarios como trompas) 3. Fondo del saco de Douglas 4. Grandes vasos ilíacos (si es posible)\n\nEcografía TRANSVAGINAL\n⟶ Preparación: El examen se hace con la vejiga vacía o con poca cantidad de orina. Lo ideal es una camilla con perneras, si no se dispone de ella, la paciente en decúbito supino, con las rodillas flexionadas. La sonda irá cubierta con una funda de látex (ojo alergias) con gel por dentro y por fuera de la funda (¡¡¡ojo estudio previo a inseminación!! no se usa gel fuera supuestamente el gel reduce la movilidad espermática!!). Es recomendable una buena higiene por parte de la paciente y la presencia de personal femenino en la sala durante el estudio.\n⟶ Técnica de examen: Se introduce la sonda, esta vía permite estudiar las estructuras pélvicas desde más cerca. Se usarán sondas endocavitarias de alta frecuencia con final convexo y ángulo variable. Se dispone de sondas volumétricas que permiten en cada barrido adquirir un volumen y después trabajar los diferentes planos anatómicos en la estación de trabajo. Se explorará el útero valorando el tamaño, el contorno y la orientación, se mide el grosor endometrial y se rastrea el miometrio y el cérvix. Los ovarios y anejos, se estudiarán lateralizando y angulando la sonda hacia ambos lados, valorando su morfología y tamaño en los tres ejes.\n\nSONOHISTEROGRAFÍA\nEstudio de la cavidad uterina mediante eco transvaginal mientras se introduce suero salino en su interior mediante un catéter balón. Es una técnica excelente para diferenciar miomas submucosos de pólipos pediculados.\n⟶ Indicaciones: 1. Sangrado vaginal en premenopáusicas y pos 2. Estudio de endometrio anormal en pacientes posmenopáusicas asintomáticas en tto con tamoxifeno 3. En infertilidad (estudio de adherencias) 4. Complicaciones en la gestación.\n⟶ Contraindicaciones: 1. Posibilidad de embarazo 2. Sospecha o infección pélvica 3. Estenosis cervical que impide el emplazamiento del catéter.\n⟶ Preparación: Se hace en fase proliferativa del ciclo (0-14 días), para evitar la posibilidad de embarazo. Si existe sospecha de hidrosálpinx, se debe hacer profilaxis antibiótica. Se realizará siempre una eco basal del miometrio y los anejos.\n⟶ Técnica de estudio: Con la paciente en la camilla, se desinfectan los genitales externos, se coloca el espéculo con visualización directa del cérvix, se introducirá el catéter y una vez en la cavidad endometrial se infla el balón con 2ml de suero salino. Se introduce la sonda vaginal y se retira el catéter hasta emplazar el balón en el orificio cervical interno para que no refluya el suero. Después se empieza con la inyección de suero lentamente para evitar turbulencias y artefactos. La cantidad de suero que se debe introducir varía entre 5 y 10 mL.\n\nOTRAS TÉCNICAS\n→ SONOHISTEOSALPINGOGRAFÍA: Para valorar la permeabilidad tubárica sin el uso de radiaciones ionizantes, la preparación y la técnica son parecidas a la histero, pero se usa contraste ecográfico en lugar de suero salino, lo que permite perfilar la luz tubárica y comprobar si las trompas son permeables y si se produce volcado a la cavidad peritoneal.\n→ ECOGRAFÍA TRANSRECTAL: Vía alternativa para valorar la pelvis femenina, se puede usar en mujeres vírgenes, cuando la vía vaginal no es posible (estrechez, dolor...) y como guía de acceso para procedimientos intervencionistas (drenaje de colecciones pélvicas, biopsias, etc)\n→ ECOGRAFÍA TRANSPERINEAL: Tercera elección en casos concretos, estudio del suelo pélvico, en pacientes obesas y como guía alternativa de procedimientos intervencionistas, tanto drenaje de abscesos en fondo de saco como toma de biopsias.\n\nANATOMÍA ECOGRÁFICA DEL APARATO GENITAL FEMENINO\n→ ÚTERO: Debe evaluarse siempre el tamaño, la forma y la orientación, el endometrio (espesor), el miometrio y el cérvix, así como la unión uterovaginal.\n· Tamaño: Varía con la edad, es pequeño en la edad prepuberal, aumenta durante la edad fértil y vuelve a disminuir por atrofia en la menopausia. Se mide el eje longitudinal desde el fondo uterino hasta el ángulo entre el cuello y la vagina. En eje transversal máximo (ancho del útero) y el diámetro AP medido en la zona más ancha del cuerpo.\n· Posición: Suele encontrarse ligeramente angulado hacia delante (anteversión), dependiendo del grado de repleción vesical. Puede encontrase angulado hacia atrás (retroversión), lo habitual es que el eje esté centrado en la línea media pero puede estar lateralizado (lateroversión), esto no es patológico y depende de la laxitud de los anclajes uterinos, del relleno vesical y rectal y de la presión intraabdominal.\n· Ecoestructura uterina: 1. Cuerpo: El miometrio es homogéneo, sólido e isoecogénico con los músculos y sirve como referencia para las demás estructuras sólidas de la pelvis. 2. Cavidad Uterina y endometrio: La línea endometrial es un fino trazo ecogénico, central, mejor apreciado con el haz de ultrasonidos perpendicular al útero y difícil de ver si está en retroversión. Corresponde a la interfase entre las dos capas del endometrio adheridas entre sí y es una cavidad virtual. Durante la menstruación se puede desdoblar la línea debido a la presencia de sangre en la cavidad. El endometrio está sometido a variaciones cíclicas hormonales, y se identifican 4 fases: 1. Semana 1 → apenas se ve el endometrio 2. Semana 2 → una banda hipoecogénica rodea la línea cavitaria 3. Semanas 3y4 → (fase postovulatoria) en la fase secretora se produce un aumento del espesor endometrial y la línea cavitaria se rodea de una banda hiperecogénica rodeada por un halo hipoecogénico. 4. Fase menstrual → desaparece la proliferación endometrial.\n3. Vasos uterinos: Se valoran mejor con Doppler color. Las arterias uterinas corren a ambos lados del útero y de ellas salen múltiples ramas perpendiculares que son las arterias arqueadas, estructuras tubulares anecogénicas. Hay que diferenciarlas de los plexos venosos periuterinos, más laterales.\n4. Cuello: Los límites no se detectan con precisión, porque su ecogenicidad es casi igual a la del cuerpo. El conducto cervical se continúa con la cavidad uterina y el endometrio se interrumpe en la región ístmica. El moco preovulatorio puede verse como una zona hipoecogénica central que desaparece tras la ovulación. Son muy frecuentes los quistes de Naboth (no patológicos).\n⟶ VAGINA: Cavidad virtual que presenta una imagen de tren bandas, una central ecogénica (interfase), rodeada por otras dos hipoecogénicas correspondientes a las paredes anterior y posterior. En el corte sagital medio está orientada hacia arriba y hacia atrás, y en el transversal tiene forma de óvalo, el diámetro mayor transversal y menor anteroposterior.\n⟶ TROMPAS: No se ven, excepto si están dilatadas, pero su porción proximal (cubierta por un ligamento ancho) a menudo se ve como una expansión lateral del cuerpo uterino en cortes transversales.\n⟶ OVARIOS: Normalmente están situados por delante de los vasos hipogástricos, inmediatamente por debajo de la bifurcación ilíaca, a ambos lados del fondo uterino, por dentro de los vasos ilíacos y por delante del músculo iliopsoas. Son “laterouterinos” aunque su localización puede variar: Retrouterinos (fondo del saco), Suprauterinos (sobre todo si existen adherencias) el útero está lateralizado, Anterouterinos, cuando el útero está en retroversión.\n· Forma: Son ovalados, con su eje mayor oblicuo hacia abajo y hacia fuera cuando son laterouterinos.\n· Tamaño: Viene dado por los tres ejes longitud (eje mayor) es la más difícil de determinar y la más fiable, se mide en un corte sagital oblicuo cuando el ovario es laterouterino, en otras posiciones se debe buscar el eje mayor girando el transductor. / anchura / grosor (son más imprecisas. Estas dimensiones son útiles para calcular el volumen del ovario. Longitud x Anchura x Grosor/2.\nCuando llega la menopausia, los ovarios se atrofian y se hacen más ecogénicos, a veces son difíciles de localizar.\n· Ecoestructura ovárica: Los ovarios suelen presentar una ecoestructura sólida y homogénea, aunque pueden presentar pequeñas formaciones quísticas en su periferia. A veces se pueden diferenciar dos zonas → Cortical periférica: menos ecogénica, y en la que se desarrollan los folículos al inicio del ciclo → Medular central: más ecogénica.\n** hacia la mitad del ciclo menstrual, los quistes foliculares, pueden llegar a medir 2 2.5 cm, aunque no deben considerarse patológicos.\n\nOTRAS ESTRUCTURAS PÉLVICAS\nFondo del saco de Douglas: Es el repliegue pélvico del peritoneo, localizado por delante del recto y detrás del útero. Aquí se pueden localizar pequeñas cantidades de líquido peritoneal, que se ven como una banda anecogénica situada justo detrás del cuello uterino. Un poco de líquido puede ser fisiológico, durante la ovulación, por rotura folicular, y durante la menstruación debido al reflujo menstrual a través de las trompas.\nVejiga: Anterior en la cavidad pélvica, constituye una ventana acústica para estudios de ecografía pélvica. Tiene forma ovalada, su contenido es anecogénico y sus paredes lisas, con un grosor menor a 5mm. En el sector posterior está el trígono y a los lados los meatos ureterales ligeramente sobreelevados.\nAsas intestinales, recto y sigma: Cuando la vejiga está llena, desplaza las asas hacia arriba, aunque pueden descender y dificultar la visualización de los ovarios. Cuando están llenas de líquido, pueden simular masas pélvicas o quistes ováricos complejos, diferenciarlas se basa en la presencia de movimientos peristálticos.\nMusculatura pélvica: ⟶ Músculos piriformes/piramidales: pared muscular posteroinferior de la pelvis, con forma triangular y no deben confundirse con los ovarios ⟶ Músculos obturadores internos: pared lateral baja de la pelvis, los podemos ver en cortes axiales con angulación lateral. ⟶ Músculos iliopsoas: Pared lateral alta de la pelvis, los vasos ilíacos se localizan por delante y por dentro.\nVasos pélvicos: Tanto arterias como venas ilíacas primitivas, ilíacas internas y externas, se pueden ver con facilidad en modo B y con Doppler color. Los ilíacos ext. son los que podemos ver por delante del iliopsoas.\nUréteres: Están detrás de la vejiga, y se ven a través de ella, más arriba pasan por detrás de los ovarios y a no ser que estén dilatados, no podemos ver los uréteres.\nParedes óseas de la pelvis: Aparecen como líneas hiperecogénicas con sombra posterior. Son fáciles de identificar el sacro por detrás y las palas ilíacas a los lados.\nUretra: Se ve en el corte axial por debajo del plano basal de la vejiga como una estructura redondeada, tubular, con doble halo ecogénico.\n\nPATOLOGÍA DE LA PELVIS FEMENINA\nLa eco, permite determinar la localización y la dependencia de órgano de la mayoría de las lesiones, determinar con bastante seguridad si son sólidas o líquidas y aproximar su tamaño.\n\n⟶ PATOLOGÍA OVÁRICA\nLesiones quísticas ováricas: Los benignos se presentan en forma redonda y ovalada, anecogénica con refuerzo acústico posterior, de paredes finas sin septos ni nódulos murales y sin flujo interno en el estudio con Doppler:\n⟶ Quistes foliculares: anecogénicos, de -3cm y los encontramos en la periferia de los ovarios. De paredes lisas y que desaparecen en la segunda fase del ciclo menstrual. Tras la ovulación son fisiológicos y sin significado patológico.\n⟶ Quistes funcionales: son folículos que no llegan a romperse y siguen creciendo, son uniloculares, anecogénicos y de paredes lisas. Suelen desaparecer después de 2 o 3 ciclos menstruales.\n⟶ Quistes hemorrágicos: muy dolorosos, pueden aparentar una apendicitis si están en el lado derecho. Aparecen a mitad de ciclo, pueden tener relación con el coito y si se rompen, pueden asociarse a hemoperitoneo. Suelen disminuir de tamaño hasta desaparecer, de forma redonda u ovalada, con un patrón interno reticular, a veces, con apariencia sólida, buena transmisión de los ultrasonidos y sin flujo interno.\n⟶ Endometriomas: Formaciones quísticas con tejido endometrial ectópico, su presentación clínica es dolor menstrual, son redondos, con ecos finos internos, de paredes lisas sin septos ni nódulos murales y sin flujo interno.\n⟶ Ovarios poliquísticos: Provocados por disfunción endocrina, los ovarios aumentan de volumen y tamaño y se ven ocupados por múltiples microquistes periféricos, no varían de un ciclo a otro. Se asocia a hiperplasia del estroma ovárico que se manifiesta como puentes hiperecogénicos en la zona central del ovario que se introducen entre los microquistes.\n⟶ Quistes paraováricos: Son formaciones anecogénicas de paredes lisas localizadas en los sectores parauterinos, en el seno del ligamento ancho y no dependen ni del ovario ni del útero. Tienen su origen en las estructuras mesonéfricas (conductos de Wolf) y paramesonéfricas (conductos de Müller). Son lesiones quísticas de paredes lisas próximas al ovario normal ipsilateral, que no sufren cambios durante el ciclo menstrual.\n⟶ Cistoadenomas serosos: De origen epitelial, son los tumores ováricos más comunes, tanto los benignos como los malignos. Son lesiones sin ecos o con tenues ecos internos, de paredes lisas y fina. Son difíciles de distinguir de los quistes simples cuando son pequeños. Suelen tener algún tabique grueso o nódulos murales con flujo interno.\n\nLesiones ováricas de tipo mixto (sólido/quísticas):\n⟶ Quiste hemorrágico\n⟶ Endometriomas\n⟶ Quistes dermoides (teratomas maduros): son muy frecuentes en pacientes jóvenes, pueden ser bilaterales. De tamaño variable, y su principal complicación es la torsión. Formados por contenido ectodérmico, mesodérmico y endodérmico (pelos, dientes, grasa..) dependiendo del tejido que predomine cambiará su aspecto ecográfico. Aparecen como formaciones complejas, con áreas hiperecogénicas con sombra, con moderada atenuación del sonido y mala visualización de su pared posterior.\n⟶ Cistoadenoma / cistoadenocarcinoma mucinoso: son los segundos más frecuentes de origen epitelial, suelen ser grandes con contenido ecogénico, tabiques, nódulos y proyecciones papilares murales. Si se rompe, da origen a la invasión del moco de la cavidad peritoneal (seudomixoma peritoneal).\n⟶ Carcinoma endometrioide: Lesiones malignas de predominio sólido con áreas quísticas o necróticas y con grandes nodulaciones murales. Pueden ser bilaterales y se asocian a hiperplasia o a carcinoma endometrial.\n\nLesiones sólidas\n⟶ Tumor de Brenner: Lesión rara, siempre benigna, formada por células epiteliales y tejido fibroso. Suele ser un hallazgo casual en mujeres asintomáticas. Las imágenes son masas sólidas, bien delimitadas, hipoecogénicas y con aspecto similar a los miomas.\n⟶ Teratomas: son tumores que dependen de células germinales, el 95% son benignos y se dividen en 3 tipos: 1. Maduro (quistes dermoides) 2. Inmaduro: De componentes indiferenciados de crecimiento rápido y generalmente malignos 3. Teratomas monodérmicos: Formados por un sólo tipo de tejido mesenquimal (carcinoide ovárico, struma ovarii, formado por tejido tiroideo y tumores neurales.)\n⟶ Fibromas o fibrotecomas ováricos: Son muy raros -1%, aunque los más frecuentes de los tumores benignos sólidos. Son hormonalmente activos y es frecuente que coexistan con hiperplasias o carcinomas endometriales. Son lesiones sólidas, hipoecogénicas, con atenuación del sonido y muy similares a los miomas uterinos.\n⟶ Metástasis: son relativamente frecuentes 10% de los tumores malignos de ovario. Los tumores que más metastizan en el ovario son: → Gastrointestinales (Krukenberg) → Páncreas → Mama → Endometrio. Ecográficamente suelen ser bilaterales, sólidas a veces con áreas quísticas o necróticas.\n⟶ Linfoma: El primario ovárico es extremadamente raro; generalmente, la afectación ovárica es secundaria a enfermedad diseminada, ecográficamente suelen ser masas sólidas, hipoecogénicas, grandes, lobuladas y bien delimitadas.\n\nPATOLOGÍA UTERINA\n⟶ Miomas: Frecuentes en mujeres en edad fértil, suelen ser asintomáticos, crecen durante la edad reproductiva y en el embarazo debido a la influencia estrogénica. En la menopausia disminuyen y tienden a desaparecer. Pueden ser múltiples, y si protruyen hacia la cavidad endometrial, pueden causar sangrado vaginal anormal. Según su localización reciben el nombre de “subserosos”, “murales”, “submucosos”, “pediculados”, etc. Suelen ser masas sólidas bien delimitadas, redondeadas, hipoecogénicas y menos a menudo isoecogénicas o hiperecogénicas con respecto al miometrio; si calcifican son hiperecogénicas y en Doppler hipervasculares.\n⟶ Adenomiosis: Afección común en mujeres de 30-50 años más frecuente en multíparas, suele presentarse con dolor pélvico, sangrado anormal y dispareunia (dolor coital). Se ve como masas miometriales mal delimitadas, heterogéneas, con múltiples quistes pequeños o engrosamiento miometrial asimétrico que afecta habitualmente a la vertiente posterior del útero el adenomioma, es difícil de distinguir de los miomas.\n⟶ Pólipos endometriales: Se ven como engrosamiento endometrial, dependen de la capa basal de endometrio y están unidos al miometrio. Suelen presentarse con sangrado anormal, y aunque la ecografía tanto transabdominal como endovaginal pueden ser diagnósticas, se suele hacer una histerosalpingografía para corroborarlo. Suelen ser hiperecogénicos, de contornos lisos, con un pedículo en cuyo interior se pueden identificar estructuras vasculares con Doppler.\n⟶ Carcinoma de endometrio: Pacientes postmenopáusicas con sangrado vaginal, presencia de engrosamiento endometrial de 10-15mm, de contornos imprecisos con afectación del miometrio. No es rara la presencia de líquido en la cavidad endometrial.\n⟶ Sarcoma uterino: Tumor relativamente raro, ecográficamente muy similar a los miomas, suele ser sólido y heterogéneo muy hipervascular. La sospecha de este tumor viene dada por el crecimiento muy rápido, el dolor y la invasión de órganos vecinos.\n\nPATOLOGÍA TUBÁRICA\n⟶ Hidrosálpinx: Dilatación en la zona ampular e infundibular de la trompa, causada generalmente por enfermedad inflamatoria pélvica, endometriosis, adherencias posquirúrgicas o tumores. Se ve como una estructura tubular tabicada, hipoecogénica, con líquido en su interior a veces con ecos internos si contiene pus (piosálpinx) o sangre (hemosálpinx).\n⟶ Enfermedad inflamatoria pélvica: Pacientes con historia previa de enfermedad inflamatoria o dolor pélvico. La presentación más frecuente es el absceso tuboovárico, que se ve como una masa anexial compleja, con líquido ecogénico (purulento) asociado a piosálpinx y a líquido en el fondo del saco.\n\nOTRAS ALTERACIONES PÉLVICAS\nNo es raro que afecciones de otros órganos, puedan parecer afecciones ováricas o uterinas:\n⟶ Riñón pélvico: Es la localización ectópica del riñón, debemos sospechar si vemos una masa compleja en la pelvis y no vemos el riñón en su sitio.\n⟶ Apendicitis: Puede simular enfermedad inflamatoria, y un apéndice cecal inflamado puede parecer una trompa engrosada o viceversa.\n⟶ Adenopatías: Pueden simular tumores ováricos o parauterinos; son múltiples y no tiene relación anatómica con el útero ni con los ovarios.\n\nPROCEDIMIENTOS INTERVENCIONISTAS GUIADOS POR ECO\nLa ecografía es la técnica ideal por la baja tasa de complicaciones, poder evitar intervenciones quirúrgicas, por el hecho de poder realizarlas de manera ambulatoria.\n⟶ Procedimientos por vía transabdominal o transperineal: Se pueden hacer con técnica manos libres, o con guía para la aguja incorporada a la sonda. PAAF para citologías de quistes y tumores y BAG para obtención de material histológico. Siempre bajo estricto control en tiempo real por eco.\nPara el drenaje de abscesos pélvicos, por vía percutánea, se puede utilizar la punción directa con catéter tipo trocar o mediante la técnica de Seldinger.\n⟶ Procedimiento por vía transvaginal y transrectal: Se usan sondas endocavitarias con guía incorporada para introducir la aguja de forma segura. La vía vagina es la más usada para muchos procedimientos y como guía de las técnicas de reproducción asistida. Su uso se ha extendido a la reducción del número de embriones en embarazos múltiples (feticidio) y al tratamiento del embarazo ectópico.\nTanto la vía rectal como la vaginal son muy útiles para el drenaje de colecciones pélvicas profundas (saco de Douglas)`};

°','-45° a +45°'],0,'Tus apuntes indican aproximadamente de -15° a +15°.'],['En el estudio mamario 3D descrito en tus apuntes se realizan:',['Solo CC','Tomosíntesis CC + ML','Solo MLO','Solo una lateral'],1,'El esquema indica 3D = tomosíntesis en CC + ML.']];

k]).filter(z=>ans[z[1]]!==z[0][2]);document.getElementById('review').innerHTML=w.length?'<h3>📌 Para repasar</h3><ol>'+w.map(z=>`<li><b>${z[0][0]}</b><br><span class="small">Correcta: ${z[0][1][z[0][2]]}</span></li>`).join('')+'</ol>':'<h3>🏆 ¡Perfecto!</h3><p>Has acertado las 20 preguntas.</p>'}
