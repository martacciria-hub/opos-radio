name: Add Module 4 to main menu
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  add-module4:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Module 4 link if missing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'MÓDULO 4 · RADIOLOGÍA CONVENCIONAL · TEMAS 28–34'
          if marker not in s:
              link = '<p><a href="modulo4.html">📘 MÓDULO 4 · RADIOLOGÍA CONVENCIONAL · TEMAS 28–34</a></p>'
              pos = s.lower().rfind('</body>')
              if pos == -1:
                  raise SystemExit('No se encontró </body> en index.html')
              s = s[:pos] + link + s[pos:]
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          if git diff --quiet; then
            echo 'No changes needed'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Añadir acceso al Módulo 4 en el menú principal'
            git push
          fi
