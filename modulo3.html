12:`TEMA 12. VÍAS DE ADMINISTRACIÓN DE CONTRASTE\n\nLos medios de contraste aumentan la capacidad diagnóstica de las técnicas de imagen.\n\n• RX: yodo y bario.\n• RM: gadolinio.\n• Ecografía: microburbujas.\n\nVÍAS DIGESTIVAS\nVía oral → esófago, estómago e intestino delgado.\nVía rectal → intestino grueso; enema opaco y doble contraste con bario + aire.\nAnte sospecha de perforación se evita el bario y se utiliza un contraste yodado hidrosoluble según el contexto.\n\nVÍAS INTRAVASCULARES\nIntravenosa → vena periférica.\nIntraarterial → acceso arterial según el procedimiento; la femoral es un acceso clásico, pero no es el único.\n\nVÍAS ESPECIALES\nArtrografía → contraste dentro de una articulación.\nArtro-TC → yodo no iónico diluido.\nArtro-RM directa → contraste paramagnético diluido intraarticular.\nHisterosalpingografía → cavidad uterina y trompas.\nDacriografía → vías lagrimales.\nSialografía → glándulas salivales.\nGalactografía → conductos mamarios.`,
13:`TEMA 13. CONTRASTES RADIOGRÁFICOS\n\nCONTRASTES NEGATIVOS\nAire y CO₂ son radiotransparentes y disminuyen la atenuación.\n\nCONTRASTES POSITIVOS\nBario y contrastes yodados aumentan la atenuación.\n\nBARIO\nSe utiliza principalmente en el aparato digestivo. Es útil por vía oral y rectal. Ante sospecha de perforación intestinal se prefiere un contraste yodado hidrosoluble.\n\nYODADOS\nPueden ser iónicos o no iónicos, y monómeros o dímeros. Los iónicos se disocian y presentan mayor osmolaridad; los no iónicos presentan menor osmolaridad y, en general, mejor tolerancia.\n\nPROPIEDADES\nLa viscosidad depende de concentración, estructura molecular y temperatura. Menor viscosidad facilita mayores velocidades de inyección. La concentración de yodo se relaciona con la opacidad. La osmolaridad se relaciona con la cantidad de partículas en solución y puede influir en determinadas reacciones.\n\nELIMINACIÓN\nLos contrastes yodados se eliminan principalmente por vía renal, aunque algunos pueden presentar eliminación biliar.`,
14:`TEMA 14. CONTRASTES ECOGRÁFICOS\n\nSon agentes basados en microburbujas que contienen gases. Las microburbujas oscilan al interactuar con el ultrasonido y generan señales armónicas.\n\nGASES\nEntre los gases utilizados se encuentran el hexafluoruro de azufre y otros gases poco solubles, según el agente comercial.\n\nVENTAJAS\nNo son contrastes yodados, no contienen gadolinio y no presentan la nefrotoxicidad característica de los contrastes yodados.\n\nCEUS HEPÁTICA\nUna aplicación especialmente importante es la caracterización de lesiones focales hepáticas. En los protocolos habituales se describen fases arterial, portal y tardía; los tiempos son aproximados y dependen del protocolo y del agente.\n\nIMPORTANTE\nLas dosis y las contraindicaciones dependen del producto concreto y de su ficha técnica; no deben memorizarse como reglas universales.`,
15:`TEMA 15. CONTRASTES EN RESONANCIA MAGNÉTICA\n\nGADOLINIO\nEs el contraste paramagnético más utilizado en RM. Se administra unido a un agente quelante.\n\nEFECTO\nEl gadolinio acorta principalmente T1, por lo que el realce suele verse como aumento de señal en secuencias potenciadas en T1. También puede producir acortamiento de T2 y disminución de señal cuando la concentración es suficiente.\n\nQUELANTES\nLos agentes macrocíclicos presentan, en general, mayor estabilidad del quelato que los lineales.\n\nVÍA\nLa vía intravenosa es la más habitual, aunque existen otras vías según la exploración.\n\nHEPATOESPECÍFICOS\nAlgunos agentes son captados por hepatocitos y presentan eliminación biliar, permitiendo caracterizar lesiones y estudiar la vía biliar.\n\nFUNCIÓN RENAL\nLa selección del agente y las precauciones dependen de la función renal y del producto concreto. La fibrosis sistémica nefrogénica se asocia especialmente a determinados agentes y a insuficiencia renal avanzada.`,
16:`TEMA 16. OTROS FÁRMACOS EN RADIOLOGÍA Y CARRO DE PAROS\n\nCARRO DE PAROS\nDebe incluir material para ventilación y apertura de vía aérea, soporte circulatorio, fármacos, monitor-desfibrilador y material de monitorización. Debe estar accesible, ordenado y revisado.\n\nSEDACIÓN\nEl midazolam es una benzodiacepina utilizada para sedación en determinados procedimientos.\n\nCARDIO-RM DE ESTRÉS\nAdenosina y dipiridamol producen vasodilatación coronaria. La dobutamina aumenta la frecuencia cardíaca y la contractilidad.\n\nANGIO-TC CORONARIO\nLos betabloqueantes pueden utilizarse para controlar la frecuencia cardíaca. La nitroglicerina sublingual puede utilizarse para producir vasodilatación coronaria.\n\nAPARATO URINARIO\nLa furosemida aumenta la diuresis y puede utilizarse para distender la vía urinaria en determinados estudios.\n\nAPARATO DIGESTIVO\nLos antiperistálticos reducen el movimiento intestinal. La secretina estimula principalmente la secreción de bicarbonato pancreático y tiene aplicaciones en estudios pancreáticos.`,
17:`TEMA 17. COMPLICACIONES Y REACCIONES ADVERSAS\n\nREACCIONES\nLas reacciones relacionadas con propiedades fisicoquímicas, dosis y osmolaridad son previsibles. Las reacciones de tipo alérgico/seudoalérgico pueden ser impredecibles.\n\nTIEMPO\nLas reacciones inmediatas/agudas aparecen durante la administración o poco después; las tardías aparecen posteriormente, habitualmente entre horas y días.\n\nGRAVEDAD\nPueden ser leves, moderadas o graves. El shock anafiláctico es una reacción grave.\n\nRIÑÓN\nLa disfunción renal previa es un factor de riesgo importante para lesión renal asociada al contraste.\n\nGADOLINIO\nLa fibrosis sistémica nefrogénica se relaciona con determinados agentes y con insuficiencia renal avanzada.\n\nEXTRAVASACIÓN\nLa primera actuación es detener la administración. Después se valora la zona, se eleva el miembro y se aplican las medidas locales indicadas por el protocolo y el producto.\n\nSITUACIONES ESPECIALES\nLa gestión de metformina depende de la función renal y del tipo de estudio. El contraste yodado puede interferir con estudios de radioyodo al disminuir su captación. En embarazo y lactancia se valora siempre la relación beneficio-riesgo y la ficha técnica del agente.`
};

const titles={12:'TEMA 12 · VÍAS DE ADMINISTRACIÓN DE CONTRASTE',13:'TEMA 13 · CONTRASTES RADIOGRÁFICOS',14:'TEMA 14 · CONTRASTES ECOGRÁFICOS',15:'TEMA 15 · CONTRASTES EN RESONANCIA MAGNÉTICA',16:'TEMA 16 · OTROS FÁRMACOS Y CARRO DE PAROS',17:'TEMA 17 · COMPLICACIONES Y REACCIONES ADVERSAS'};
function buildMenus(){for(const id of Object.keys(topics)){const b=document.createElement('button');b.className='topicBtn';b.innerHTML='<b>'+titles[id]+'</b>';b.onclick=()=>openTopic(id);document.getElementById('topicButtons').appendChild(b);const t=document.createElement('button');t.className='testTopic';t.textContent=titles[id];t.onclick=()=>startTest(id);document.getElementById('testTopics').appendChild(t)}}
function showSection(s){document.getElementById('temas').classList.toggle('hidden',s!=='temas');document.getElementById('tests').classList.toggle('hidden',s!=='tests');document.getElementById('tabTemas').classList.toggle('active',s==='temas');document.getElementById('tabTests').classList.toggle('active',s==='tests');if(s==='tests')showTests()}
function openTopic(id){document.getElementById('topicList').classList.add('hidden');document.getElementById('topicView').classList.remove('hidden');document.getElementById('topicText').textContent=topics[id]}
function closeTopic(){document.getElementById('topicView').classList.add('hidden');document.getElementById('topicList').classList.remove('hidden')}
let current=[],pos=0,score=0,answered=false;
function showTests(){document.getElementById('testMenu').classList.remove('hidden');document.getElementById('quiz').classList.add('hidden');document.getElementById('res').classList.add('hidden')}
function startTest(id){current=tests[id];pos=0;score=0;document.getElementById('testMenu').classList.add('hidden');document.getElementById('res').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');renderQuestion()}
function renderQuestion(){answered=false;const x=current[pos];document.getElementById('n').textContent='Pregunta '+(pos+1)+' de '+current.length;document.getElementById('m').textContent=score+' aciertos';document.getElementById('p').style.width=((pos)/current.length*100)+'%';document.getElementById('q').textContent=x[0];const o=document.getElementById('o');o.innerHTML='';x[1].forEach(v=>{const b=document.createElement('button');b.className='opt';b.textContent=v;b.onclick=()=>answer(b,v,x[2]);o.appendChild(b)});document.getElementById('f').classList.add('hidden');document.getElementById('next').classList.add('hidden')}
function answer(btn,v,right){if(answered)return;answered=true;const opts=document.querySelectorAll('.opt');opts.forEach(b=>b.disabled=true);if(v===right){score++;btn.classList.add('correct');document.getElementById('f').textContent='✅ ¡Correcta!'}else{btn.classList.add('wrong');opts.forEach(b=>{if(b.textContent===right)b.classList.add('correct')});document.getElementById('f').textContent='❌ La respuesta correcta es: '+right}document.getElementById('f').classList.remove('hidden');document.getElementById('next').classList.remove('hidden');document.getElementById('next').textContent=pos===current.length-1?'Ver resultado':'Siguiente'}
function next(){if(pos<current.length-1){pos++;renderQuestion()}else finish()}
function finish(){document.getElementById('quiz').classList.add('hidden');document.getElementById('res').classList.remove('hidden');const pct=Math.round(score/current.length*100);document.getElementById('score').textContent=pct+'%';document.getElementById('msg').textContent=pct>=80?'🔥 ¡Muy buen resultado!':pct>=60?'💪 ¡Vas bien, seguimos!':'📚 Repasa el tema y vuelve a intentarlo.';document.getElementById('review').innerHTML='<p>Has acertado <b>'+score+'</b> de <b>'+current.length+'</b> preguntas.</p>'}
buildMenus();
</script>
</body>
</html>
