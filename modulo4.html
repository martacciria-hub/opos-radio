utton class="topicBtn" onclick="openTopic(28)"><b>TEMA 28. RADIOLOGÍA CONVENCIONAL APARATO URINARIO</b></button><button class="topicBtn" onclick="openTopic(29)"><b>TEMA 29. HISTEROSALPINGOGRAFIA</b></button><button class="topicBtn" onclick="openTopic(30)"><b>TEMA 30. RADIOLOGÍA CONVENCIONAL DENTAL</b></button><button class="topicBtn" onclick="openTopic(31)"><b>TEMA 31. RADIOLOGÍA CONVENCIONAL EN PORTÁTIL, UCI Y QUIRÓFANO</b></button><button class="topicBtn" onclick="openTopic(32)"><b>TEMA 32. RADIOLOGÍA PEDIÁTRICA</b></button><button class="topicBtn" onclick="openTopic(33)"><b>TEMA 33. ESTUDIO RADIOLÓGICO DE LA MAMA, MX Y GALACTO</b></button><button class="topicBtn" onclick="openTopic(34)"><b>TEMA 34. RADIOLOGÍA CONVENCIONAL. DENSITOMETRÍA</b></button></div></div><div id="topicView" class="card hidden"><button class="back" onclick="closeTopic()">← Volver a temas</button><div id="topicText" class="notes"></div></div></section></main><script>const topics={28:`TEMA 28. RADIOLOGÍA CONVENCIONAL APARATO URINARIO

UROGRAFÍA I.V / PIELOGRAFÍA I.V
Objetivo: Es un estudio funcional del sist. urinario mediante inyección I.V de contraste yodado, permitiendo estudiar la morfología y la patología de los riñones, sist. pielocaliciales, uréteres y vejiga.

CISTOGRAFÍA
Objetivo: Permite valorar vejiga, cuello vesical, y uretra, mediante la introducción de un contraste por sonda vesical.

Indicaciones principales: Incontinencia y cistocele, evaluación de malformaciones, treumatísmos con sospecha de perforación vesical, reflijo vesiculouretral, cálculos de baja densidad, lesiones polipoideas, fístulas urinarias y divertículos.

URETROCISTOGRAFÍA RETRÓGRADA Y MICCIONAL EN VARONES
Objetivo: Estudio de la uretra y la vejiga.
Indicaciones principales: Estenosis congénitgas y adquiridas, traumatismos con uretrorragia, anomalías congénitas, trastornos funcionales de la micción.
Contraindicaciones: Infección en período agudo (cistouretritis), obstrucción completa uretral (no forzamos el sondaje, puncionamos en la zona suprapúbica).

PIELOGRAFÍA RETRÓGRADA O ASCENDENTE
Objetivo: Estudio seriado retrógrado del sistema pielocalicial y del uréter en casos de uropatía obstructiva.

PIELOGRAFÍA ANTEROGRADA O DESCENDENTE
Objetivo: Estudio seriado anterógrado del sistema pielocalicial y del uréter inyectando el contraste a través del catéter de nefrostomía.

ILEOGRAFÍA
Objetivo: Esta exploración se solicita en pacientes a los que se les ha extirpado la vejiga y se ha realizado una nueva, interponiendo una asa del íleon entre los uréteres y la pared abdominal.`,29:`TEMA 29. HISTEROSALPINGOGRAFIA

Objetivo: Permite la evaluación del útero y las trompas de falopio tras introducir contraste radiopaco a través del canal cervical. Es una técnica fundamental en el estudio de infertilidad femenina, para el estudio morfológico y funcional de las trompas de falopio.

Aunque se le atribuye cierto efecto terapéutico, es un procedimiento con finalidad diagnóstica.

Indicaciones: Estudio de infertilidad; Estudio de abortos de repetición; Estudio de malformaciones uterinas congénitas; Valoración de la efectividad de métodos anticonceptivos como la ligadura de trompas o dispositivos intratubáricos.

Contraindicaciones: Posible embarazo; Enfermedad pélvica inflamatoria activa o sangrado uterino activo; Alergia grave a los contrastes yodados (aunque se puede administrar una pauta de premedicación).

Requisitos previos: No es necesaria una preparación especial, aunque es aconsejable la administración de un antiinflamatorio no esteroideo 1h antes de la prueba.

Citación: Es importante realizar la prueba en la fase folicular del ciclo para tener un endometrio fino, para que sea más fácil la interpretación de las imágenes, ideal es entre el 7º y 12º día (contando a partir del primer día de la menstruación).

Material: Solución antiséptica; Catéter puede ser S. Floey o Sistema de vacío desechable; Contraste yodado hidrosoluble 5-10ml de baja osmolaridad; Espéculo; Pinzas pozzi; Medicación espasmolítica (buscapina 10mg).

Técnica: Tumbamos a la paciente en posición ginecológica y hacemos una RX de PELVIS. Limpiamos la zona genital externa y localizamos el cuello uterino mediante tacto vaginal y se coloca el espéculo. Después de purgar la sonda, se introduce por el orificio cervical externo. Rellenamos el balón con aire, y retiramos el espéculo. Empezamos a introducir el contraste a baja presión y controlando por fluoroscopio, generalmente son suficientes 5-10 ml.

Secuencia de imágenes: 1. Postcontraste inicial. 2. Postcontraste con distensión completa de la cavidad. 3. Visualización de ambos conductos tubáricos. 4. Paso del contraste a la cavidad peritoneal en cantidad suficiente por ambas trompas. 5. Una vez obtenidas las imágenes, se retira el catéter y se realiza una rx postevacuación para comprobar la distribución libre del contraste en la cavidad peritoneal.

Nota: Pueden ser necesarias proyecciones complementarias como: con tracción del cuello; proyecciones oblicuas; en decúbito lateral o prono.`,30:`TEMA 30. RADIOLOGÍA CONVENCIONAL DENTAL

FÓRMULA Y NOMENCLATURA DENTALES

En el ser humano existen dos denticiones:

DENTICIÓN DECIDUA (dientes de leche): Constituida por 20 piezas: 8 incisivos, 4 caninos, 8 premolares.
DENTICIÓN PERMANENTE: Constituida por 32 piezas: 8 incisivos, 4 caninos, 8 premolares, 12 molares.

NOMENCLARUTAS DE USO MÁS COMUN: Nomenclatura por cuadrantes de Palmer; Nomenclatura de la American Dental Association; Nomenclatura de la Feredación Dental Internacional.

INTRODUCCIÓN
Los dientes son pequeños órganos, duros, de color blanco amarillento que se disponen en forma de arco en ambos maxilares donde están incrustados en unas cavidades llamadas alveolos.

Tienen 3 funciones: Digestiva, Fonética y Estética.

TERMINOLOGIA
Mesial: Es aquello que se ACERCA al plano sagital medio.
Distal: Es aquello que se ALEJA del plano sagital medio.
Vestibular/labial/bucal: Es la cara del diente que mira hacia FUERA.
Lingual: Es la cara del diente que mira hacia DENTRO.
Palatino: Es la cara del diente que mira hacia DENTRO y mira al paladar.

TÉCNICAS CONVENCIONALES DE RAD. DENTAL
INTRAORALES: Aleta de mordida; Rx Periapicales; Rx Oclusales.
EXTRAORALES: Rx Oblicua Lateral; Teleradiografía lateral de cara y cráneo (cefalometría); Rx Ortopantomografía; TAC DENTAL.

La TAC dental se usa para implantes dentales, para planificación de precirugía, para estudiar estructuras neurovasculares y calidad del hueso, así como lesiones en el hueso.`,31:`TEMA 31. RADIOLOGÍA CONVENCIONAL EN PORTÁTIL, UCI Y QUIRÓFANO

Los chasis, sean digitales o convencionales, se cubriran con una bolsa de plástico u otro tipo de cubierta para que no entren en contacto directo con el paciente por cuestiones de higiene y manipulación.

PROTECCIÓN RADIOLÓGICA:
1. Delantal plomado
2. Protección gonadal a paciente si es posible
3. 2m de distacia técnico-tubo al disparar
4. Avisar de viva voz que se va a disparar
5. No se dispara hasta que no se “haya ido todo el mundo”.

PROYECCIONES RADIOLÓGICAS
TX PORTÁTIL: Se hace en AP y en decúbito supino la mayoría de las veces. Según la situación del paciente debemos intentar hacerla en sedestación para “mejorar” el diagnóstico y evitar las diferencias morfológicas.

ABD PORTÁTIL: Se adquiere en AP y decúbito supino, teniendo en cuenta: colocar soporte en rodillas para relajar musculatura, brazos fuera del campo, procurar que esté centrado y sin rotaciones, adquisición un par de segundos después de terminar la espiración, para que el diafragma esté en su posición más elevada y por supuesto debemos incluir todo el abdomen.

PROYECCIONES COMPLEMENTARIAS: Tx lateral en inspiración (derrame pleural); Tx lateral en espiración (neumotórax); Abd lateral (neumoperitoneo); Abd supino y rayo lateral (neumoperitoneo en paciente no movilizable).

RX ESQUELÉTICAS
El arco está provisto de sistemas de sujeción “en todos los planos”. Los equipos más nuevos tienen la opción de fluoroscopia pulsada, en la que la radiación se activa y desactiva en cortos intervalos de tiempo durante la exposición, con ello podemos reducir la dosis.

PROTECCIÓN RADIOLÓGICA: Exigible delantal y protección tiroidea plomada para todo el personal; restringir el uso de radioscopia; el arco siempre por debajo del paciente (si es posible); intensificador lo más próximo al paciente; fluoroscopia pulsada sin magnificación; colimar al máximo; evitar manipulación durante disparo; OJO con las oblicuas; reducir al máximo el nº de placas.

TRABAJO EN QUIRÓFANO
El técnico de radiología es personal no estéril, se tendrá que mover con cuidado para no contaminar zonas estériles. Deberá ir vestido con ropa adecuada para el entorno quirúrgico y llevar el delantal plomado y las protecciones necesarias.`,32:`TEMA 32. RADIOLOGÍA PEDIÁTRICA

INTRODUCCIÓN
La radiología pediátrica se encarga de todas las técnicas desde la época prenatal hasta la edad adulta. Es necesario adaptar las técnicas de imagen, minimizando dosis, eligiendo medios de contraste más apropiados para cada prueba y edad, y también es conveniente cuidar el entorno y que el técnico desarrolle aptitudes y habilidades para el manejo de los niños.

RX DE TÓRAX
En recién nacidos, lactantes y niños mayores, la dosis de radiación de una placa en PA o AP, tiene que oscilar entre 0.05 y 0.3 mGy. El Kilovoltaje debería oscilar entre 60Kv (para niños pequeños) y 150kV (para niños de tamaño adulto). En cuanto a los milis intentaremos que los tiempos sean lo más reducidos posible. La DFP mayor de 182cm para reducir la magnificación (aunque se podrá llegar a 1m, si fuera necesario). El foco no excederá los 2mm (rango recomendado 0.6-1.2mm).

PROCEDIMIENTOS CON FLUORSOCOPIA
La adquisición de imágenes radiográficas debe limitarse única y exclusivamente a cuando sea esencial para el diagnóstico o el procedimiento. Una imágen preliminar puede ser útil en abdómen agudo, calcificaciones, anomalías esqueléticas y de situs, patrón de aireación intestinal, neumoperitoneo, cirugías previas y catéteres/electrodos.

MEDIOS DE CONTRASTE GASTROINTESTINALES EN PEDIATRÍA
El tipo y la cantidad de contraste están determinados por la edad del niño y el motivo de la exploración. El medio de contraste más usado es el bario, por vía oral, rectal, ostomía o catéter. Está contraindicado si se sospecha o hay una perforación del tracto gastrointestinal; en estos casos es preferible usar contrastes yodados hidrosolubles.

ESOFAGOGRAMA Y TRACTO GASTROINTESTINAL SUPERIOR
ESOFAGOGRAMA: evaluar anatomía y motilidad del esófago mediante proyecciones AP y lateral.
TRACTO GASTROINTESTINAL SUPERIOR: evaluar deglución, anatomía y motilidad de esófago, estómago y duodeno y observar el paso inicial de contraste por duodeno.

ENEMA
Consiste en una exploración del colon mediante enema de contraste guiado por fluoroscopia. Contraindicaciones: perforación del colon, colon isquémico, megacolon tóxico, shock hipervolémico, peritonitis e inestabilidad clínica.

INVAGINACIÓN INTESTINAL
La eco es la técnica para el diagnóstico de las invaginaciones intestinales (afección grave donde una parte del intestino se introduce en otra adyacente, similar a un telescopio). La eco permite reducirla guiada por un enema de suero, lo que evita el uso de radiaciones ionizantes.

ENFERMEDAD DE HIRSCHSPRUNG
Los contrastes más comunes son el bario o los hidrosolubles. En neonatos o bebés son preferibles los hidrosolubles diluidos. El recto debe ser cateterizado con una sonda blanda sin llenar el globo.

ÍLEO MECONIAL DEL NEONATO
La evaluación radiológica debe preceder al intento de tratamiento no quirúrgico del íleo meconial no complicado. Para realizar el enema, normalmente se usa contraste hidrosoluble casi isotónico y se infunde controlando con el fluoroscopio, preferiblemente por gravedad.

CISTOURETROGRAFÍA MICCIONAL SERIADA
Es un estudio del tracto urinario inferior. Se requiere cateterización aséptica de la vejiga, contraste yodado y observación con fluoroscopia. El objetivo es evaluar vejiga, uretra, anatomía postoperatoria y micción, incluida la presencia o ausencia de reflujo vesicoureteral.

ESCOLIOSIS
Es la alteración de la alineación de la columna vertebral. La telerradiografía de columna total en bipe es una técnica útil para confirmar la presencia de escoliosis, medir el grado de curvatura y definir el tipo. El estudio debe incluir toda la columna desde los ángulos mandibulares hasta los trocánteres mayores.

SERIE ÓSEA
Conjunto de varias RX que engloban el estudio de todo el esqueleto. Una indicación habitual es la sospecha de maltrato, displasias esqueléticas, síndromes, alteraciones metabólicas y algunas neoplasias.`,33:`TEMA 33. ESTUDIO RADIOLÓGICO DE LA MAMA, MX Y GALACTO

El objetivo de la mamografóa, es obtener imágenes de alta resolución y con buen contraste de la estuctura interna de la mama, que permita detectar la patología de la mama, aunque sean tan sutilues como las microcalcificaciones en el carcinoma de mama.

ANATOMIA
La mama está situada en la cara anterior del tórax sobre el pectoral mayor y se extiende desde la segunda hasta la 7ª costilla. Los ligamentos de Cooper forman una especie de picos que se unen a la piel. Los conductos mayores se dilatan en la porción ampular y después se ramifican hasta formar acinos.

NOMENCLATURA
El sistema más usado es el de los cuadrantes, dividiendo la mama en 4 con el pezón como centro y referencia.

TÉCNICA MX
La mamografía se hace en un equipo de RX, que consta de un generador de corriente, una columna con un brazo giratorio que contiene el tubo de rayos, un compresor y un receptor de imagen. El tubo tiene un ánodo de molibdeno o de rodio y pequeños puntos focales de 0.3 y 0.1mm.

MX DIGITAL INDIRECTA
La película tradicional se substituye por una lámina luminiscente fotoestimulable. El chasis se introduce en el digitalizador.

MX DIGITAL DIRECTA
No usamos chasis ni película ni lámina. El detector está alojado justo debajo de la mama. Hay dos tipos de detectores, el fósforo-silicio amorfo o el selenio amorfo.

TOMOSÍNTESIS
Es una técnica tridimensional basada en una modificación de la mx digital, el tubo hace un barrido obteniendo imágenes de dos y tres dimensiones en una sola compresión, después podemos hacer reconstrucciones tridimensionales de 1mm de grosor.

PROYECCIONES DE RUTINA
OML (oblicua medio lateral): el tubo se angula 45º.
CC (craneo caudal): el tubo se coloca con el rayo perpendicular al suelo.

CALIDAD TÉCNICA DE LA MX
Las mamas deben estar lo más simétricas posible y proyectar la mayor cantidad de tejido posible. El pezón debe quedar de perfil. Las MX deben estar rotuladas en todas las proyecciones.

PROYECCIONES ADICIONALES
CC exagerada lateralmente; Cola axilar (Cleopatra); Proyección Valle; ML (90º); LM (90º); Proyección modificada Caudo Craneal (al revés).

COMPRESIÓN PUNTUAL Y MAGNIFICACIÓN
Usando un compresor más pequeño conseguimos comprimir en la zona que necesita el radiólogo, y si además quiere magnificar la zona, lo conseguimos separando la mama del detector.

PATOLOGÍAS DE LA MAMA
La mamografía es actualmente el mejor método de cribado poblacional. Se ha establecido una clasificación con los hallazgos de la MX, conocido como BIRADS.

Lesiones Benignas: Mastopatía fibroquistica y displasia mamaria; Fibroadenoma; Quistes.
Lesiones Malignas: El carcinoma de mama es el tipo de cáncer más frecuente en la mujer. En la MX, el cáncer de mama puede tener diferentes presentaciones, generalmente se ve una masa definida con márgenes espiculados o estrellados, un área de asimetría o microcalcificaciones sospechosas.

PROTESIS MAMARIAS
Retroglandular y Retropectoral. Para hacer la MX se usan las proyecciones estandar aplicando la técnica Eklund, empujando la prótesis hacia atrás y traccionando el tejido mamario hacia delante.

PROCEDIMIENTOS INTERVENCIONISTAS
PAAF; BAG; BEP; Galactografía; Localización de lesiones con arpón.

Galactografía: para estudiar los conductos galactofóros a través de un contraste yodado hidrosoluble radiopaco. Se canaliza el orificio del conducto y se introduce un pequeño catéter, se introduce el contraste hasta que haya reflujo y se hacen dos proyecciones CC y LAT, sin aplicar compresión. Se indica en casos de secreción patológica por el pezón.`,34:`TEMA 34. RADIOLOGÍA CONVENCIONAL. DENSITOMETRÍA

INTRODUCCIÓN
La osteoporosis, consiste en la disminución de la masa ósea y de su resistencia mecánica, que condiciona en un aumento de la incidencia de fracturas.
La densitometría, es la técnica diagnóstica que permite medir la densidad mineral del hueso.

TIPOS DE DENSITOMETRÍA
Existen diferentes técnicas para medir la densidad mineral ósea basadas en el TC, la ecografía o la RM e isopos (absociometría fotónica simple y dual). Aunque la absormetría con RX dual o de doble energía DXA, es la técnica de elección para cuantificar la masa ósea DMO.

ABSORCIONMETRÍA CON RX DE DOBLE ENERGÍA
Los equipos consisten en una fuente de RX y un detector de alta resolución. La fuente de RX de baja dosis produce fotones de dos niveles de energía.

Según la morfología del haz, hay dos tipos de equipos: HAZ EN LAPICERO y HAZ EN ABANICO.

ABSORCIONMETRÍA CON RX DE DOBLE ENERGÍA PORTÁTIL (esqueleto periférico)
Son más pequeños y baratos, pero también menor fiabilidad, sirven como técnica de cribado. El estudio con portátil se hace en la falange media del tercer dedo de la mano no dominante.

ABSORCIONMETRÍA CON RX DE DOBLE ENERGÍA MESA ESTABLE (esqueleto axial)
Es el equipo más usado para el estudio de osteoporosis estudiando las regiones de columna lumbar y cadera.

PROTOCOLOS DE ESTUDIO EN MESA ESTABLE
Los pacientes no requieren una preparación específica. Contraindicaciones: embarazo, contraste oral 5 días antes, estudios de medicina nuclear 2 días antes. Debemos retirar todos los objetos metálicos y explicar la necesidad de permanecer quieto durante el estudio.

Regiones de estudio en ADULTOS: columna lumbar (L1-L4) y fémur proximal; añadiremos el antebrazo en pacientes en los que una de las áreas anteriores no sirva, o en pacientes con hiperparatiroidismo.

Regiones de estudio en NIÑOS y ADOLESCENTES(-20): Sólo se estudia el área lumbar.

COLOCACIÓN DEL PACIENTE Y CENTRAJE
Columna lumbar PA: paciente en decúbito en el centro de la mesa, rodillas flexionadas sobre un soporte para reducir la lordosis.
Cadera: paciente en decúbito centrado en la mesa con la pierna en abducción y en rotación interna de 15-30º.
Antebrazo: se estudia el no dominante, paciente sentado al lado de la mesa con el antebrazo apoyado y con la mano en pronación.

COLOCACIÓN DEL ÁREA DE ANÁLISIS
Columna lumbar: ROI en cuerpos vertebrales L1 a L4. Se deben excluir del análisis las vértebras con fractura o lesión.
Cadera: área de análisis en cuello femoral, evitando la rama isquiopubiana.
Antebrazo: ROI en extremidad distal del radio.

INTERPRETACIÓN DEL ESTUDIO, TERMINILOGÍA
Contenido mineral óseo: Cantidad de calcio CONCRETA.
Densidad mineral ósea: Cantidad MEDIA de calcio por unidad de área (g/cm2) o volumen (g/cm3).
Puntuación T: Sirve para el diagnóstico de osteoporosis en mujeres posmenospáusicas y se usa también en hombres mayores de 50 años.
Normal: puntuación T >-1,0. osteopenia: puntuación T entre -1 y -2,5. osteoporosis: puntuación T <-2,5.
Puntuación Z: Se usa en niños y adolescentes (hasta los 20 años) y también para mujeres premenopáusicas y hombres -de 50 años. Con puntuación Z inferior a -2, el diagnóstico es “densidad ósea baja para la edad”.

ABSORCIONMETRÍA CON RAYOS X DE DOBLE ENERGÍA AXIAL EJECUTADA CON MESA ESTABLE DE CUERPO ENTERO VALORACIÓN DE COMPOSICIÓN CORPORAL.

Colocación del paciente: decúbito supino, centrado en la mesa, con los brazos a los lados del cuerpo sin tocar las piernas y con los pulgares hacia arriba. Si el paciente es obeso, el estudio se realiza sobre medio cuerpo.

INTERPRETACIÓN DEL ESTUDIO (TERMINOLOGÍA)
El equipo calcula la composición por regiones anatómicas: masa grasa, masa magra y hueso. También obtiene la distribución de la grasa en regiones predefinidas: Androide (central) y Ginoide (cadera y muslos).

El índice de masa corporal no distingue grasa de músculo. Los valores de DMO en cuerpo entero, sirven para estimar la mineralización, pero no permiten el diagnóstico de osteoporosis.

CONTROL DE CALIDAD
Para calibrar el equipo y verificar la exactitud y precisión de las medidas, se debe realizar una prueba de control de calidad diario antes de empezar a hacer mediciones a los paciente. El control se hará como mínimo una vez por semana si el densitómetro no se está usando. Se usa un bloque de calibración fabricado en un material equivalente al tejido con unas cámaras que simulan hueso con contenido mineral óseo conocido.`};function showSection(s){document.getElementById('temas').classList.toggle('hidden',s!=='temas');document.getElementById('tabTemas').classList.toggle('active',s==='temas')}function openTopic(n){document.getElementById('topicList').classList.add('hidden');document.getElementById('topicView').classList.remove('hidden');document.getElementById('topicText').textContent=topics[n]}function closeTopic(){document.getElementById('topicView').classList.add('hidden');document.getElementById('topicList').classList.remove('hidden')}</script></body></html>
