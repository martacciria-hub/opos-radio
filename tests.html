let current=null,idx=0,score=0,answers=[];
function renderMenu(){const g=document.getElementById('groups');g.innerHTML='';let last='';bank.forEach((t,i)=>{let key=t.mod; if(key!==last){let d=document.createElement('div');d.className='group';d.innerHTML='<h3>'+(['','📘 MÓDULO 1 · RADIOLOGÍA CONVENCIONAL','📗 MÓDULO 2 · RADIOLOGÍA DIGITAL','💊 MÓDULO 3 · FÁRMACOS Y MEDIOS DE CONTRASTE'][key])+'</h3><div></div>';g.appendChild(d);last=key}let holder=g.lastElementChild.querySelector('div');let b=document.createElement('button');b.className='topic';b.innerHTML='<b>'+ (t.tema?('Tema '+t.tema+' · '):'')+t.titulo+'</b><br><small>'+t.qs.length+' preguntas</small>';b.onclick=()=>start(i);holder.appendChild(b)});}
function start(i){current=bank[i];idx=0;score=0;answers=[];document.getElementById('menu').style.display='none';document.getElementById('result').style.display='none';document.getElementById('quiz').style.display='block';showQ();window.scrollTo({top:0,behavior:'smooth'})}
function showQ(){let q=current.qs[idx];document.getElementById('num').textContent='Pregunta '+(idx+1);document.getElementById('total').textContent='de '+current.qs.length;document.getElementById('bar').style.width=((idx)/current.qs.length*100)+'%';document.getElementById('question').textContent=q[0];let o=document.getElementById('options');o.innerHTML='';q[1].forEach((txt,j)=>{let b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+j)+') '+txt;b.onclick=()=>answer(j);o.appendChild(b)});document.getElementById('feedback').style.display='none';document.getElementById('next').style.display='none'}
function answer(j){let q=current.qs[idx], ok=j===q[2];answers.push([j,q[2]]);if(ok)score++;[...document.querySelectorAll('.opt')].forEach((b,k)=>{b.disabled=true;if(k===q[2])b.classList.add('correct');if(k===j&&!ok)b.classList.add('wrong')});let f=document.getElementById('feedback');f.style.display='block';f.innerHTML=ok?'✅ <b>Correcta</b>':'❌ <b>Incorrecta.</b> La respuesta correcta es <b>'+String.fromCharCode(65+q[2])+') '+q[1][q[2]]+'</b>.';let n=document.getElementById('next');n.style.display='block';n.textContent=idx===current.qs.length-1?'Ver resultado':'Siguiente pregunta';n.onclick=next}
function next(){idx++;if(idx<current.qs.length)showQ();else finish()}
function finish(){document.getElementById('quiz').style.display='none';document.getElementById('result').style.display='block';document.getElementById('score').textContent=score+' / '+current.qs.length;let pct=Math.round(score/current.qs.length*100);document.getElementById('message').textContent=pct>=90?'🔥 Excelente nivel de examen.':pct>=70?'💪 Muy buen resultado.':'📚 Repasa los fallos y vuelve a intentarlo.';let r=document.getElementById('review');r.innerHTML='<h3>Resumen</h3>'+current.qs.map((q,i)=>'<div>'+(i+1)+'. '+(answers[i][0]===answers[i][1]?'✅':'❌')+' Correcta: '+String.fromCharCode(65+q[2])+') '+q[1][q[2]]+'</div>').join('')}
function backMenu(){document.getElementById('result').style.display='none';document.getElementById('quiz').style.display='none';document.getElementById('menu').style.display='block';window.scrollTo({top:0,behavior:'smooth'})}
renderMenu();
